<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ParkProxy — Private Audio Call</title>
  <meta name="description" content="Privacy-focused WebRTC audio calling via unique room URLs." />
  <style>
    /* --------------------------------------------------------------
       Reset & base
       -------------------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      line-height: 1.5;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 640px;
      margin: 0 auto;
      padding: 1rem;
    }

    /* --------------------------------------------------------------
       Header
       -------------------------------------------------------------- */
    header {
      padding: 1rem 0 0.5rem;
      border-bottom: 1px solid #334155;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }

    /* --------------------------------------------------------------
       Lobby (pre-call)
       -------------------------------------------------------------- */
    #lobby {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #start-btn {
      width: 100%;
      max-width: 320px;
      padding: 1.25rem 2rem;
      font-size: 1.25rem;
      font-weight: 700;
      background: #dc2626;
      color: #ffffff;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.4);
    }

    #start-btn:hover {
      background: #b91c1c;
      box-shadow: 0 6px 8px -1px rgba(220, 38, 38, 0.5);
    }

    #start-btn:active {
      transform: scale(0.98);
    }

    #start-btn:disabled {
      background: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    button {
      width: 100%;
      max-width: 320px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    /* --------------------------------------------------------------
       Call (active call)
       -------------------------------------------------------------- */
    #call-ui {
      display: none;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
    }

    #remote-label {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 0.25rem;
    }

    #status {
      font-size: 0.875rem;
      color: #64748b;
      min-height: 1.25rem;
    }

    /* --------------------------------------------------------------
       Audio visualizer
       -------------------------------------------------------------- */
    #audio-viz {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin: 1rem 0;
    }

    #audio-viz.visible {
      display: flex;
    }

    .viz-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }

    .viz-label {
      font-size: 0.75rem;
      color: #64748b;
    }

    .viz-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 60px;
      padding: 0.5rem;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 0.75rem;
    }

    .viz-bar {
      width: 6px;
      background: #3b82f6;
      border-radius: 2px;
      transition: height 0.05s ease-out;
    }

    .viz-bar.active {
      background: #22c55e;
    }

    .viz-pulse {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #3b82f6;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viz-pulse.active {
      border-color: #22c55e;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    }

    .viz-pulse::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid currentColor;
      opacity: 0;
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .viz-pulse.active::after {
      opacity: 0.5;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      70% {
        transform: scale(1);
        opacity: 0;
      }
      100% {
        transform: scale(0.8);
        opacity: 0;
      }
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      width: 100%;
      max-width: 420px;
    }

    .controls button {
      flex: 1;
      max-width: none;
      padding: 0.625rem 1rem;
      font-size: 0.95rem;
    }

    #mute-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
    }

    #mute-btn:hover {
      background: #334155;
    }

    #mute-btn.muted {
      background: #7f1d1d;
      border-color: #991b1b;
    }

    #mute-btn.muted:hover {
      background: #991b1b;
    }

    #end-btn {
      background: #7f1d1d;
      color: #ffffff;
    }

    #end-btn:hover {
      background: #991b1b;
    }

    /* --------------------------------------------------------------
       Overlays
       -------------------------------------------------------------- */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      text-align: center;
      padding: 1rem;
    }

    #overlay.visible {
      display: flex;
    }

    #overlay h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    #overlay p {
      color: #94a3b8;
      margin-bottom: 1.5rem;
      max-width: 320px;
    }

    #overlay button {
      max-width: 260px;
      width: 100%;
    }

    /* --------------------------------------------------------------
       Utilities
       -------------------------------------------------------------- */
    .hidden {
      display: none !important;
    }

    .text-accent {
      color: #3b82f6;
    }

    @media (max-width: 480px) {
      #app {
        padding: 0.5rem;
      }
      header h1 {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>ParkProxy</h1>
      <p>Private audio calls &mdash; no phone numbers, no personal data.</p>
    </header>

    <!-- Lobby: start a call in the shared room -->
    <section id="lobby">
      <h2>ParkProxy</h2>
      <p>Click Start Call to enter the shared audio room. One other person can join you.</p>
      <button id="start-btn">Start Call</button>
    </section>

    <!-- Active call UI -->
    <section id="call-ui">
      <div id="remote-label">Connected to peer</div>
      <div id="participant-count">Participants: 1</div>
      <div id="status">Establishing secure connection&hellip;</div>
      <div id="audio-viz">
        <div class="viz-group">
          <div class="viz-label">You</div>
          <div class="viz-bars" id="local-viz-bars">
            <div class="viz-bar"></div>
            <div class="viz-bar"></div>
            <div class="viz-bar"></div>
            <div class="viz-bar"></div>
            <div class="viz-bar"></div>
            <div class="viz-bar"></div>
            <div class="viz-bar"></div>
            <div class="viz-bar"></div>
            <div class="viz-bar"></div>
            <div class="viz-bar"></div>
          </div>
        </div>
        <div class="viz-pulse" id="remote-viz-pulse"></div>
      </div>
      <div class="controls">
        <button id="mute-btn">Mute Mic</button>
        <button id="end-btn">End Call</button>
      </div>
    </section>

    <!-- Full-screen error / info overlay -->
    <div id="overlay">
      <h2 id="overlay-title">Error</h2>
      <p id="overlay-message">Something went wrong.</p>
      <button id="overlay-action">OK</button>
    </div>
  </div>

  <script>
    /* --------------------------------------------------------------
       Constants & configuration
       -------------------------------------------------------------- */
    const WS_PROTOCOL = location.protocol === "https:" ? "wss:" : "ws:";
    const WS_HOST = location.host;
    const WS_URL = `${WS_PROTOCOL}//${WS_HOST}/ws`;

    // Public Google STUN servers + OpenRelay TURN servers for NAT traversal.
    // Note: The public OpenRelay TURN credentials below are community-provided
    // and may change. For production, self-host a TURN server (e.g. coturn).
    // Base STUN servers (public Google). TURN servers are filled in at runtime
    // from /turn-credentials so the static coturn password never ships to the
    // frontend. Credentials are time-limited via coturn auth-secret mode.
    const STUN_URLS = [
      "stun:stun.l.google.com:19302",
      "stun:stun1.l.google.com:19302",
      "stun:stun2.l.google.com:19302",
      "stun:stun3.l.google.com:19302",
      "stun:stun4.l.google.com:19302",
    ];

    let turnCredentials = null;

    async function fetchTurnCredentials() {
      try {
        const resp = await fetch("/turn-credentials");
        if (!resp.ok) throw new Error("Failed to fetch TURN credentials");
        turnCredentials = await resp.json();
      } catch (err) {
        console.warn("TURN credentials unavailable, falling back to STUN only:", err);
        turnCredentials = null;
      }
    }

    function buildRtcConfig() {
      const iceServers = STUN_URLS.map((url) => ({ urls: url }));
      if (turnCredentials) {
        const { username, credential } = turnCredentials;
        iceServers.push(
        { urls: "turn:140.245.203.10:3478", username, credential },
        { urls: "turns:140.245.203.10:5349?transport=tcp", username, credential }
        );
      }
      return { iceServers, iceCandidatePoolSize: 0 };
    }

    const MAX_ROOM_LENGTH = 64;

// Single shared room — everyone who clicks Start Call joins here
const PUBLIC_ROOM = "parkproxy-public";

    /* --------------------------------------------------------------
       DOM elements
       -------------------------------------------------------------- */
    const $ = (id) => document.getElementById(id);

    const lobbyEl = $("lobby");
    const callUiEl = $("call-ui");
    const overlayEl = $("overlay");
    const overlayTitleEl = $("overlay-title");
    const overlayMessageEl = $("overlay-message");
    const overlayActionEl = $("overlay-action");

    const startBtnEl = $("start-btn");

    const remoteLabelEl = $("remote-label");
    const statusEl = $("status");
    const participantCountEl = $("participant-count");
    const muteBtnEl = $("mute-btn");
    const endBtnEl = $("end-btn");

    /* --------------------------------------------------------------
       State
       -------------------------------------------------------------- */
    let roomId = null;
    let ws = null;
    let peerConnection = null;
    let localStream = null;
    let isCaller = false;
    let isMuted = false;
    let peerRole = null; // "offerer" | "answerer", set by signaling server
    let roleResolve = null;
    let overlayResolve = null;
    let remoteAudioElements = []; // Track remote audio elements for cleanup
    let audioContext = null;
    let localAnalyser = null;
    let remoteAnalyser = null;
    let vizAnimationId = null;
    const localBars = document.querySelectorAll("#local-viz-bars .viz-bar");
    const remotePulseEl = $("remote-viz-pulse");
    const audioVizEl = $("audio-viz");

    /* --------------------------------------------------------------
       Helpers
       -------------------------------------------------------------- */
    function setStatus(text) {
      statusEl.textContent = text;
    }

    function showOverlay(title, message, actionLabel = "OK") {
      return new Promise((resolve) => {
        overlayResolve = resolve;
        overlayTitleEl.textContent = title;
        overlayMessageEl.textContent = message;
        overlayActionEl.textContent = actionLabel;
        overlayEl.classList.add("visible");
      });
    }

    function hideOverlay() {
      overlayEl.classList.remove("visible");
      if (overlayResolve) {
        overlayResolve();
        overlayResolve = null;
      }
    }

    function generateRoomId() {
      // Short, URL-friendly room id
      return crypto.randomUUID().replace(/-/g, "").slice(0, 12);
    }

    function buildRoomUrl(room) {
      return `${location.origin}?room=${encodeURIComponent(room)}`;
    }

    function waitForRole() {
      return new Promise((resolve) => {
        if (peerRole) {
          resolve();
          return;
        }
        roleResolve = resolve;
      });
    }

    /* --------------------------------------------------------------
       WebRTC
       -------------------------------------------------------------- */
    async function initLocalStream() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: false, // audio-only
        });
      } catch (err) {
        let msg = "Microphone access denied.";
        if (err.name === "NotAllowedError") {
          msg =
            "Microphone permission was denied. Please allow microphone access and refresh.";
        } else if (err.name === "NotFoundError") {
          msg = "No microphone device found on this device.";
        } else if (err.name === "NotReadableError") {
          msg = "The microphone is in use by another application.";
        } else if (err.name === "OverconstrainedError") {
          msg = "Microphone constraints could not be satisfied.";
        } else if (err.name === "TypeError") {
          msg = "Invalid audio constraints requested.";
        }
        throw new Error(msg);
      }

      // Expose local stream (muted by default so you don't hear yourself)
      const localAudio = new Audio();
      localAudio.srcObject = localStream;
      localAudio.muted = true;
      localAudio.setAttribute("playsinline", "");
      // Local audio is not appended to the DOM to keep UI minimal.
      // It is kept muted purely to satisfy the browser's autoplay policy.
      localAudio.play().catch(() => {});

      // Initialize audio visualizer for local mic
      initAudioViz();
      setupStreamAnalysis(localStream, "local");
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach((track) => {
        track.enabled = !isMuted;
      });
      muteBtnEl.textContent = isMuted ? "Unmute Mic" : "Mute Mic";
      muteBtnEl.classList.toggle("muted", isMuted);
    }

    /* --------------------------------------------------------------
       Audio visualizer (Web Audio API)
       -------------------------------------------------------------- */
    function initAudioViz() {
      if (!audioContext) {
        const AudioContext =
          window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContext();
      }
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      if (vizAnimationId) return;
      vizAnimationId = requestAnimationFrame(vizLoop);
    }

    function setupStreamAnalysis(stream, type) {
      if (!audioContext) return;
      const source = audioContext.createMediaStreamSource(stream);
      const analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);
      if (type === "local") {
        localAnalyser = analyser;
      } else if (type === "remote") {
        remoteAnalyser = analyser;
      }
    }

    function getVolume(analyser) {
      if (!analyser) return 0;
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) {
        sum += data[i];
      }
      return sum / data.length / 255;
    }

    function vizLoop() {
      const localVol = getVolume(localAnalyser);
      const remoteVol = getVolume(remoteAnalyser);

      // Update local bars
      const barCount = localBars.length;
      const localHeight = Math.max(localVol * 100, 10);
      localBars.forEach((bar, i) => {
        const h = Math.max(localVol * (60 + Math.sin(i) * 20), 8);
        bar.style.height = `${h}px`;
        bar.classList.toggle("active", localVol > 0.05);
      });

      // Update remote pulse
      if (remoteVol > 0.05) {
        remotePulseEl.classList.add("active");
      } else {
        remotePulseEl.classList.remove("active");
      }

      // Show/hide viz container
      if (localVol > 0.02 || remoteVol > 0.02) {
        audioVizEl.classList.add("visible");
      }

      vizAnimationId = requestAnimationFrame(vizLoop);
    }

    async function createPeerConnection() {
      peerConnection = new RTCPeerConnection(buildRtcConfig());

      // Add local audio tracks (audio-only)
      if (localStream) {
        localStream.getTracks().forEach((track) => {
          peerConnection.addTrack(track, localStream);
        });
      }

      // Handle incoming remote audio track
      peerConnection.ontrack = (event) => {
        const [remoteStream] = event.streams;
        const audio = document.createElement("audio");
        audio.srcObject = remoteStream;
        audio.autoplay = true;
        audio.setAttribute("playsinline", "");
        audio.style.display = "none";
        document.body.appendChild(audio);
        remoteAudioElements.push(audio);
        audio.play().catch((err) => {
          console.warn("Remote audio autoplay blocked:", err);
        });

        // Initialize audio visualizer for remote audio
        setupStreamAnalysis(remoteStream, "remote");
      };

      // ICE candidate gathering -> signal to peer
      peerConnection.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(
            JSON.stringify({
              type: "candidate",
              candidate: event.candidate.toJSON(),
            })
          );
        }
      };

      peerConnection.oniceconnectionstatechange = () => {
        const state = peerConnection.iceConnectionState;
        setStatus(`Connection: ${state.replace(/_/g, " ")}`);
        if (state === "connected") {
          setStatus("Connected &mdash; encrypted audio stream active");
        } else if (state === "disconnected" || state === "failed") {
          setStatus("Connection lost. Refresh to reconnect.");
        }
      };

      peerConnection.onsignalingstatechange = () => {
        // Signaling state transitions are handled implicitly via WS messages.
      };

      // Only the offerer creates an offer; the answerer waits for one.
      // This prevents glare (both peers sending offers simultaneously).
      if (peerRole === "offerer") {
        isCaller = true;
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: "offer", sdp: offer }));
        setStatus("Waiting for peer to join&hellip;");
      } else {
        setStatus("Waiting for caller&hellip;");
      }

      return peerConnection;
    }

    async function handleSignalingMessage(message) {
      const { type } = message;

      if (type === "role") {
        peerRole = message.role;
        if (roleResolve) {
          roleResolve();
          roleResolve = null;
        }
        return;
      }

      // WebRTC handshake only begins once a role has been assigned.
      if (!peerRole) {
        await waitForRole();
      }

      if (type === "participant_count") {
        participantCountEl.textContent = `Participants: ${message.count}`;
        return;
      }

      if (type === "offer") {
        isCaller = false;
        await peerConnection.setRemoteDescription(
          new RTCSessionDescription(message.sdp)
        );
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: "answer", sdp: answer }));
        setStatus("Connecting to peer&hellip;");
      } else if (type === "answer") {
        await peerConnection.setRemoteDescription(
          new RTCSessionDescription(message.sdp)
        );
        setStatus("Peer answered. Connecting&hellip;");
      } else if (type === "candidate") {
        try {
          await peerConnection.addIceCandidate(message.candidate);
        } catch (err) {
          console.error("Failed to add ICE candidate:", err);
        }
      } else if (type === "bye") {
        setStatus("Peer ended the call.");
        endCall({ notifyPeer: false });
        participantCountEl.textContent = "Participants: 0";
        showOverlay("Call Ended", "The other participant left the call.", "OK").then(() => {
          window.location.replace(window.location.href);
        });
      } else if (type === "error") {
        endCall({ notifyPeer: false });
        participantCountEl.textContent = "Participants: 0";
        showOverlay("Error", message.message || "An error occurred.", "OK").then(() => {
          window.location.replace(window.location.href);
        });
      }
    }

    function endCall({ notifyPeer = true } = {}) {
      if (ws && ws.readyState === WebSocket.OPEN && notifyPeer) {
        try {
          ws.send(JSON.stringify({ type: "bye" }));
        } catch (err) {
          console.warn("Failed to send bye:", err);
        }
      }

      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      // Stop and remove all remote audio elements
      remoteAudioElements.forEach((audio) => {
        try {
          audio.pause();
          audio.srcObject = null;
        } catch (err) {
          console.warn("Failed to stop remote audio:", err);
        }
        try {
          audio.remove();
        } catch (err) {
          console.warn("Failed to remove remote audio element:", err);
        }
      });
      remoteAudioElements = [];

      // Cleanup audio visualizer
      if (vizAnimationId) {
        cancelAnimationFrame(vizAnimationId);
        vizAnimationId = null;
      }
      if (audioContext) {
        try {
          audioContext.close();
        } catch (err) {
          console.warn("Failed to close audio context:", err);
        }
        audioContext = null;
      }
      localAnalyser = null;
      remoteAnalyser = null;

      // Reset visualizer UI
      localBars.forEach((bar) => {
        bar.style.height = "8px";
        bar.classList.remove("active");
      });
      remotePulseEl.classList.remove("active");
      audioVizEl.classList.remove("visible");

      if (localStream) {
        localStream.getTracks().forEach((track) => track.stop());
        localStream = null;
      }

      isCaller = false;
      isMuted = false;
      muteBtnEl.textContent = "Mute Mic";
      muteBtnEl.classList.remove("muted");
    }

    function returnToLobby() {
      endCall({ notifyPeer: false });
      callUiEl.style.display = "none";
      lobbyEl.style.display = "flex";
      setStatus("");
      participantCountEl.textContent = "Participants: 1";
    }

    /* --------------------------------------------------------------
       WebSocket signaling
       -------------------------------------------------------------- */
    async function connectSignaling(room) {
      roomId = room;
      const url = `${WS_URL}/${encodeURIComponent(room)}`;

      ws = new WebSocket(url);

      ws.onopen = () => {
        setStatus("Connected to signaling server.");
      };

      ws.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);
          handleSignalingMessage(message);
        } catch (err) {
          console.error("Invalid signaling message:", err);
        }
      };

      ws.onclose = (event) => {
        if (event.code === 1008) {
          // Policy violation (room full)
          returnToLobby();
          showOverlay("Room Full", "This room already has two participants. Try a different room name.", "OK");
          return;
        }
        setStatus("Disconnected from signaling server.");
        if (!callUiEl.classList.contains("hidden")) {
          showOverlay(
            "Disconnected",
            "You were disconnected from the call. Refresh to reconnect.",
            "Reconnect"
          ).then(() => {
            returnToLobby();
          });
        }
      };

      ws.onerror = (err) => {
        console.error("WebSocket error:", err);
        setStatus("Signaling error. Refresh to retry.");
      };

      return ws;
    }

    /* --------------------------------------------------------------
       UI initialization
       -------------------------------------------------------------- */
    function initUI() {
      // Single shared room — everyone joins the same room
      roomId = PUBLIC_ROOM;

      startBtnEl.addEventListener("click", async () => {
        startBtnEl.disabled = true;
        startBtnEl.textContent = "Calling&hellip;";

        try {
          await initLocalStream();

          await connectSignaling(PUBLIC_ROOM);

          // Wait for the server to assign a WebRTC role (offerer/answerer).
          await waitForRole();

          // Fetch time-limited TURN credentials before creating the peer
          // connection so coturn auth-secret mode works.
          await fetchTurnCredentials();

          await createPeerConnection();

          lobbyEl.style.display = "none";
          callUiEl.style.display = "flex";
          setStatus(
            peerRole === "offerer"
              ? "Waiting for peer to join&hellip;"
              : "Waiting for caller&hellip;"
          );
        } catch (err) {
          console.error(err);
          startBtnEl.disabled = false;
          startBtnEl.textContent = "Start Call";
        await showOverlay("Call Error", err.message, "OK");
        }
      });

      muteBtnEl.addEventListener("click", toggleMute);

      endBtnEl.addEventListener("click", () => {
        endCall({ notifyPeer: true });
        showOverlay("Call Ended", "You ended the call.", "OK").then(() => {
          returnToLobby();
        });
      });

      overlayActionEl.addEventListener("click", () => {
        hideOverlay();
      });
    }

    /* --------------------------------------------------------------
       Kick off
       -------------------------------------------------------------- */
    document.addEventListener("DOMContentLoaded", initUI);
  </script>
</body>
</html>
